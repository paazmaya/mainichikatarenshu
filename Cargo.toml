[package]
name = "mainichikatarenshu"
description = "E-ink display showing a kata for each day, along with current electricity price"
version = "0.1.0"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/paazmaya/mainichikatarenshu"
keywords = ["esp32", "e-ink", "embedded", "kata", "epaper"]
categories = ["embedded"]
publish = false
rust-version = "1.95"

[workspace]
members = ["crates/*"]
resolver = "2"

[lib]
name = "mainichikatarenshu"
harness = true

[[bin]]
name = "mainichikatarenshu"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors
required-features = ["firmware"]

[features]
default = []
test-utils = [
  "dep:critical-section",
  "critical-section/std",
  "dep:embedded-io-async",
  "dep:mbedtls-rs",
  "mbedtls-rs/tls-server",
  "dep:rand_core",
] # Feature for host test utilities
firmware = []
wifi = [
  "firmware",
  "dep:critical-section",
  "dep:embassy-executor",
  "dep:embassy-net",
  "dep:embassy-sync",
  "dep:embassy-time",
  "dep:embedded-io-async",
  "dep:esp-radio",
  "dep:esp-rtos",
  "dep:mbedtls-rs",
  "mbedtls-rs/embassy-time",
  "dep:rand_core",
  "dep:static_cell",
]

[dependencies]
log = "0.4.35"
heapless = { version = "0.9.3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
sequential-storage = { version = "8", features = ["postcard"] }
embedded-storage-async = "0.4"
critical-section = { version = "1", optional = true }
embedded-io-async = { version = "0.7", optional = true }
httparse = { version = "1.10", default-features = false }
mbedtls-rs = { version = "0.3", default-features = false, features = [
  "tls-client",
  "tls-core",
  "tls-proto-tls12",
  "tls-proto-tls13",
  "x509-parse",
  "pem-parse",
  "base64",
  "pk",
  "alg-sha256",
  "alg-sha512",
  "alg-hkdf",
  "drbg-ctr",
  "entropy",
  "alg-aes",
  "alg-gcm",
  "alg-chacha20",
  "alg-chachapoly",
  "alg-rsa",
  "alg-rsa-pss",
  "alg-ecp",
  "alg-ecdh",
  "alg-ecdsa",
  "curve-secp256r1",
  "curve-secp384r1",
  "curve-curve25519",
  "kex-ecdhe-ecdsa",
  "kex-ecdhe-rsa",
  "hook-wall-clock",
  "use-gcc",
  "ssl-out-content-len-4096",
], optional = true }
rand_core = { version = "0.10.1", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
md-5 = { version = "0.11", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "1.2.0", features = ["esp32s3", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32s3",
  "uart",
  "critical-section",
] }
embedded-hal-bus = "0.3.0"
esp-storage = { version = "0.10", features = ["esp32s3", "embedded-storage"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
embedded-storage = "0.3"
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"
embassy-executor = { version = "0.10", optional = true }
embassy-net = { version = "0.9", features = [
  "proto-ipv4",
  "medium-ethernet",
  "dhcpv4",
  "tcp",
  "udp",
  "dns",
], optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5", optional = true }
esp-radio = { version = "=1.0.0-beta.1", features = [
  "esp32s3",
  "wifi",
  "unstable",
], optional = true }
esp-rtos = { version = "0.4", features = ["esp32s3", "embassy", "esp-radio"], optional = true }
static_cell = { version = "2", optional = true }

[dependencies.embedded-graphics]
version = "0.8.2"
# https://github.com/embedded-graphics/embedded-graphics

[dependencies.embedded-hal]
version = "1.0.0"
# https://github.com/rust-embedded/embedded-hal

[dependencies.crowpanel-ssd1680]
path = "crates/crowpanel-ssd1680"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }

[dev-dependencies]
# Test-only dependencies
embedded-graphics = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"
embedded-storage = "0.3"

[profile.dev]
# https://doc.rust-lang.org/rustc/codegen-options/index.html#split-debuginfo
split-debuginfo = "off"
lto = "off"
debug = "full"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = "limited"
incremental = false
lto = 'fat'
opt-level = 's'

[profile.release.package.esp-radio]
opt-level = 3

[profile.dev.package.esp-radio]
opt-level = 3
