[package]
name = "mainichikatarenshu"
description = "E-ink display showing a kata for each day, along with current electricity price"
version = "0.1.0"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/paazmaya/mainichikatarenshu"
repository = "https://github.com/paazmaya/mainichikatarenshu"
keywords = ["esp32", "e-ink", "embedded", "kata", "epaper"]
categories = ["embedded"]
publish = false
resolver = "2"
rust-version = "1.95"

[lib]
name = "mainichikatarenshu"
harness = true

[[bin]]
name = "mainichikatarenshu"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors
required-features = ["firmware"]

[features]
default = []
test-utils = [] # Feature for test utilities (disables ESP32 dependencies)
firmware = []
wifi = ["firmware", "dep:embassy-executor", "dep:embassy-net", "dep:embassy-sync", "dep:embassy-time", "dep:esp-radio", "dep:esp-rtos", "dep:static_cell"]

[dependencies]
log = "0.4.35"
heapless = { version = "0.9.3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
sequential-storage = { version = "8", features = ["postcard"] }
embedded-storage-async = "0.4"
md-5 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "1.2.0", features = ["esp32s3", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "uart", "critical-section"] }
embedded-hal-bus = "0.3.0"
esp-storage = { version = "0.10", features = ["esp32s3", "embedded-storage"] }
embedded-storage = "0.3"
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"
embassy-executor = { version = "0.10", optional = true }
embassy-net = { version = "0.8", features = ["proto-ipv4", "medium-ethernet", "dhcpv4", "tcp", "dns"], optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5", optional = true }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "wifi", "unstable"], optional = true }
esp-rtos = { version = "0.4", features = ["esp32s3", "embassy", "esp-radio"], optional = true }
static_cell = { version = "2", optional = true }

[dependencies.embedded-graphics]
version = "0.8.2"
# https://github.com/embedded-graphics/embedded-graphics

[dependencies.embedded-hal]
version = "1.0.0"
# https://github.com/rust-embedded/embedded-hal

# https://github.com/mbv/ssd1680
# From there:
[dependencies.display-interface]
version = "0.5.0"

# Try it one more time...
# https://github.com/caemor/epd-waveshare
[dependencies.epd-waveshare]
version = "0.6.0"

[build-dependencies]
# Image processing at build time
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }

[dev-dependencies]
# Test-only dependencies
embedded-graphics = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"
embedded-storage = "0.3"

[profile.dev]
# https://doc.rust-lang.org/rustc/codegen-options/index.html#split-debuginfo
split-debuginfo = "off"
lto = "off"
debug = "full"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = "limited"
incremental = false
lto = 'fat'
opt-level = 's'

[profile.release.package.esp-radio]
opt-level = 3

[profile.dev.package.esp-radio]
opt-level = 3
