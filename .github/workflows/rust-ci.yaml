name: Continuous Integration

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          default: true
          buildtargets: esp32s3

      - name: Enable caching
        uses: chainguard-actions/Swatinem-rust-cache@b83da835517599f3f42d100dde7195b7edfb9e30 # v2.9.3

      - name: Build
        run: cargo +esp build --release --features firmware

      - name: Build with Wi-Fi
        run: cargo +esp build --release --features wifi

      - name: Setup Rust for tests
        uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable

      - name: Run host tests
        run: cargo +stable test --workspace --lib --tests --features test-utils --target x86_64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check --color always

      - name: Run clippy on host libraries
        run: cargo +stable clippy --workspace --lib --features test-utils --target x86_64-unknown-linux-gnu

      - name: Archive artifact
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: binaries
          path: |
            target/xtensa-esp32s3-none-elf/release/mainichikatarenshu
