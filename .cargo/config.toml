[build]
target = "xtensa-esp32s3-none-elf"
# ESP32-S3-WROOM-1-N8R8

[target.xtensa-esp32s3-none-elf]

# https://github.com/esp-rs/espflash
runner = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[unstable]
# Required for std support. Rust does not provide std libraries for ESP32 targets since they are tier-2/-3.
build-std = ["core", "alloc"]

[env]
MCU = "esp32s3"
# mbedtls-rs-sys 0.3.1 uses non-recursive bindgen allowlisting for `hook-timer`
# and omits macOS's intermediate `__darwin_time_t` typedef (`long` on LP64 Darwin).
BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_darwin = "-D__darwin_time_t=long"
BINDGEN_EXTRA_CLANG_ARGS_x86_64_apple_darwin = "-D__darwin_time_t=long"
